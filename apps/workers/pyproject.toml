[project]
name = "judite-workers"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.16,<2.17",
    "structlog>=26.1,<27",
    "redis>=8.1,<8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "import-linter>=2.15,<3",
    "testcontainers[redis]>=4.15,<5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "unit: sem I/O",
    "integration: dependências reais via testcontainers",
    "contract: contratos dos entrypoints",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
