openapi: 3.1.0
info:
  title: Judite - Números
  version: 0.3.0
servers:
  - url: /api/v1
paths:
  /numbers:
    get:
      summary: Lista os números da própria pessoa
      responses:
        '200': { description: Números, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Number' } } } } }
        '401': { description: Sem sessão }
        '403': { description: Administrador da plataforma }
  /numbers/connections:
    post:
      summary: Inicia uma tentativa e devolve o QR code
      responses:
        '201': { description: Tentativa, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '409': { description: Limite de 2 números atingido (number_limit) }
        '503': { description: Serviço de WhatsApp indisponível (whatsapp_unavailable) }
  /numbers/connections/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Consulta a tentativa; só quem a iniciou
      responses:
        '200': { description: Tentativa, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '404': { description: Inexistente ou de outra pessoa }
    delete:
      summary: Cancela a tentativa
      responses:
        '204': { description: Cancelada }
        '404': { description: Inexistente ou de outra pessoa }
  /numbers/{id}/disconnect:
    post:
      summary: Dono desconecta o próprio número
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Desconectado, content: { application/json: { schema: { $ref: '#/components/schemas/Number' } } } }
        '404': { description: Inexistente ou de outra pessoa }
  /company-numbers:
    get:
      summary: Usuários e números da empresa; só admin da empresa
      responses:
        '200': { description: Números, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CompanyNumber' } } } } }
        '403': { description: Sem perfil de admin da empresa }
  /company-numbers/{id}/disconnect:
    post:
      summary: Admin desconecta número da própria empresa
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Desconectado, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyNumber' } } } }
        '403': { description: Sem perfil de admin da empresa }
        '404': { description: Inexistente ou de outra empresa }
  /internal/webhooks/evolution:
    post:
      summary: Eventos da Evolution API; exige o cabeçalho x-judite-secret
      responses:
        '204': { description: Recebido }
        '401': { description: Segredo inválido }
  /internal/numbers/reconcile:
    post:
      summary: Reconcilia situações; exige Authorization Bearer interno
      responses:
        '200': { description: Resumo sem dados pessoais }
        '401': { description: Token inválido }
components:
  schemas:
    Number:
      type: object
      required: [id, phone, status, status_changed_at, confirmed]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        status: { enum: [connected, disconnected] }
        status_changed_at: { type: string, format: date-time }
        confirmed: { type: boolean, description: Falso quando sem confirmação há mais de 2 minutos }
        disconnect_reason: { type: [string, 'null'], enum: [owner, company_admin, phone, account_deactivated, company_deactivated, null] }
    CompanyNumber:
      allOf:
        - $ref: '#/components/schemas/Number'
        - type: object
          required: [owner_id, owner_name]
          properties:
            owner_id: { type: string, format: uuid }
            owner_name: { type: string }
    Attempt:
      type: object
      required: [id, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [pending, connected, rejected, expired, cancelled] }
        qr_code: { type: [string, 'null'], description: Imagem em base64; só com status pending }
        failure: { type: [string, 'null'], enum: [number_in_use, limit_reached, null] }
        expires_at: { type: string, format: date-time }
